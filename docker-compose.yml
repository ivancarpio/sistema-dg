version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dg_app_test
    restart: unless-stopped
    volumes:
      - ./:/var/www
  web:
    image: nginx:alpine
    container_name: dg_web_test
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
  db:
    image: mysql:8.0
    container_name: dg_db_test
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: db_dg
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data_test:/var/lib/mysql
volumes:
  db_data_test: